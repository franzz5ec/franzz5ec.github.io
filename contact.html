<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Brew Haven</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <h2>Haven Coffee</h2>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="about.html">Tentang</a></li>
                <li><a href="contact.html" class="active">Kontak</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Hubungi Kami</h1>
            <p>Ada pertanyaan atau ingin memesan untuk acara? Hubungi kami!</p>
            <div class="contact-info">
                <p><strong>Alamat:</strong> Jl. Kopi Indah No. 123, Gorontalo</p>
                <p><strong>Telepon:</strong> (0435) 123456</p>
                <p><strong>Email:</strong> info@haven.com</p>
            </div>
            <form class="contact-form" id="myForm">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Pesan:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Haven Coffee. Hak Cipta Dilindungi.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
